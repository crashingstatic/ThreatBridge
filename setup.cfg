# Mutation testing (see README, "Mutation testing"): pip install mutmut; mutmut run
[mutmut]
source_paths=threatbridge/
pytest_add_cli_args_test_selection=tests/
# Read by tests/test_integration.py (settings documented, env example, SOC actions).
also_copy=
    README.md
    Dockerfile
    gunicorn.conf.py
    deploy/
    securityonion/

[tool:pytest]
# Only tests/: not mutmut's working copy in mutants/.
testpaths = tests
