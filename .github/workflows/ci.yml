name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - name: Install the locked packages
        run: uv sync --frozen && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install nfdump and Wireshark's tools (nfcapd and pcapng tests)
        run: sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q nfdump wireshark-common
      - run: python -m pytest -q

  perf:
    name: Performance (PRF-1/2/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - name: Install the locked packages
        run: uv sync --frozen && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: TB_PERF=1 python -m pytest -q -s tests/test_perf.py

  lint:
    name: Lint (shellcheck, actionlint, pyflakes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - name: Install the locked packages
        run: uv sync --frozen --only-group lint && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: shellcheck scripts/*.sh deploy/*.sh tests/*.sh
      - run: actionlint
      - run: python -m pyflakes threatbridge tests

  security:
    name: Security scan (pip-audit, bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - name: Install the locked packages
        run: uv sync --frozen --only-group lint && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Known-vulnerable dependencies (the locked versions the container installs)
        run: |
          uv export --frozen --no-default-groups --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - name: Python security lint (medium+ severity)
        run: bandit -r threatbridge -ll

  docker:
    name: Docker build + mTLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      P12_PASS: ci-only-throwaway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Generate throwaway PKI
        run: |
          scripts/make-certs.sh ca
          scripts/make-certs.sh server localhost 127.0.0.1
          scripts/make-certs.sh client ci-analyst
      - name: Demo-backend config
        run: printf 'TB_BACKEND=demo\nTB_SOC_URL=https://so.example\n' > deploy/threatbridge.env
      - name: Build and start with deploy/run.sh
        run: sudo SO_CA="$PWD/certs/ca.crt" deploy/run.sh
      - name: Mutual TLS and CSRF checks
        run: tests/mtls_check.sh https://localhost:5443 certs ci-analyst
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: The map in a browser through mutual TLS
        run: TB_URL=https://localhost:5443 node tests/ui_mtls.mjs certs ci-analyst
      - name: Container logs
        if: always()
        run: sudo docker logs threatbridge || true

  ui:
    name: UI tests (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TB_TOKEN: ci-only-login-token-0123456789   # local mode's login (D23); the suites log in with it
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - name: Install the locked packages
        run: uv sync --frozen && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start demo server
        run: |
          TB_BACKEND=demo TB_SOC_URL=https://so.example \
          TB_EXCLUDE_FILE="$RUNNER_TEMP/exclude.json" TB_COMPROMISED_FILE="$RUNNER_TEMP/compromised.json" \
          TB_SESSIONS_DIR="$RUNNER_TEMP/sessions" \
            nohup python -m threatbridge --port 5055 > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf -H "Authorization: Bearer $TB_TOKEN" http://127.0.0.1:5055/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - run: mkdir -p "$RUNNER_TEMP/shots" && node tests/ui_smoke.mjs "$RUNNER_TEMP/shots"
        env:
          JS_COVERAGE: ${{ runner.temp }}/js-coverage
      - name: Start case-mode server (generated attack-chain pcap)
        run: |
          python tests/make_case.py "$RUNNER_TEMP/case"
          TB_LIVE_DNS=false TB_MAX_PATHS=11 TB_EXCLUDE_FILE="$RUNNER_TEMP/case-exclude.json" \
          TB_COMPROMISED_FILE="$RUNNER_TEMP/case-compromised.json" TB_SESSIONS_DIR="$RUNNER_TEMP/case-sessions" \
            nohup python -m threatbridge --port 5056 --case "$RUNNER_TEMP/case" > "$RUNNER_TEMP/case-server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf -H "Authorization: Bearer $TB_TOKEN" http://127.0.0.1:5056/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/case-server.log"; exit 1
      - run: TB_URL=http://127.0.0.1:5056 node tests/ui_case.mjs "$RUNNER_TEMP/shots"
        env:
          JS_COVERAGE: ${{ runner.temp }}/js-coverage
      - run: TB_URL=http://127.0.0.1:5056 node tests/ui_actions.mjs "$RUNNER_TEMP/shots"
        env:
          JS_COVERAGE: ${{ runner.temp }}/js-coverage
          TB_SAVED_MAPS: ${{ runner.temp }}/saved-maps
      - run: TB_URL=http://127.0.0.1:5056 node tests/ui_marks.mjs "$RUNNER_TEMP/shots"
        env:
          JS_COVERAGE: ${{ runner.temp }}/js-coverage
          TB_SAVED_MAPS: ${{ runner.temp }}/saved-maps
      - name: The maps the browser tests saved match the map document format (D22)
        run: TB_SAVED_MAPS="$RUNNER_TEMP/saved-maps" python -m pytest -q tests/test_openapi.py -k browser_tests_saved
      - name: JavaScript coverage (what the browser tests ran of app.js)
        run: node tests/js_coverage.mjs "$RUNNER_TEMP/js-coverage"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - name: Server logs
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/case-server.log" || true
