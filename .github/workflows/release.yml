# A version tag (v<version in pyproject.toml>) publishes signed source archives (D24): the
# archives, the locked dependencies as a pip requirements file with hashes, and their SHA-256
# sums, each signed with Sigstore (keyless, through GitHub's identity) and covered by a build
# provenance attestation. The README says how to verify them. No container image is published.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Signed source archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # create the release
      id-token: write       # Sigstore and provenance sign through GitHub's identity
      attestations: write   # record the provenance attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - name: The tag matches the version in pyproject.toml
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml has version $version"
            exit 1
          fi
      - name: Source archives, locked dependencies and sums
        run: |
          name="threatbridge-${GITHUB_REF_NAME#v}"
          mkdir dist
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" "$GITHUB_REF_NAME"
          git archive --format=zip --prefix="$name/" -o "dist/$name.zip" "$GITHUB_REF_NAME"
          uv export --frozen --no-default-groups --no-emit-project -o "dist/$name-requirements.txt"
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Sigstore signatures
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/*.tar.gz dist/*.zip dist/*-requirements.txt dist/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Signed source archives. To verify them, see the README, \"Releases\"."
